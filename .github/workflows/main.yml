name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Lint & Validate ───────────────────────────────────────
  validate:
    name: ✅ Validate HTML & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "❌ index.html not found!"
            exit 1
          fi
          echo "✅ index.html found ($(wc -l < index.html) lines)"

      - name: Check sitemap.xml
        run: |
          if [ -f "sitemap.xml" ]; then
            echo "✅ sitemap.xml found"
          else
            echo "⚠️  sitemap.xml not found — consider adding it"
          fi

      - name: Check robots.txt
        run: |
          if [ -f "robots.txt" ]; then
            echo "✅ robots.txt found"
          else
            echo "⚠️  robots.txt not found — consider adding it"
          fi

      - name: Report file sizes
        run: |
          echo "📦 Asset sizes:"
          find . -maxdepth 2 \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.xml" -o -name "*.txt" \) \
            ! -path "./.git/*" | sort | xargs -I{} sh -c 'echo "  {} — $(du -sh {} | cut -f1)"'

  # ─── Build & Deploy ────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment summary
        run: |
          echo "🎉 Portfolio deployed successfully!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📅 Date: $(date -u)"
          echo "🔖 Commit: ${{ github.sha }}"
